name: Close stale issues and PRs
on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "Помечено как stale: нет активности 60 дней. Отпишись, если ещё актуально."
          stale-pr-message: "Помечено как stale: нет активности 60 дней."
