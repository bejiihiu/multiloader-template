name: release

# Релиз по тегу vX.Y.Z. Версию в gradle.properties подними заранее,
# тег обязан совпадать: v1.2.3 при version=1.2.3.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build --parallel --stacktrace
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            paper/build/libs/*.jar
            velocity/build/libs/*.jar
          generate_release_notes: true
