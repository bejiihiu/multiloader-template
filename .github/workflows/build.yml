name: build

on:
  push:
    # dev собираем тоже: релизы готовятся там, ломать его втихаря нельзя
    branches: [main, master, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # JDK 25 основной: все модули собираются тулчейном 25.
      # (Foojay-резолвер докачает его и сам, но в CI быстрее ставить нужный сразу.)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        # --parallel явно: модули независимые, пусть собираются рядом.
        # (В gradle.properties тоже стоит org.gradle.parallel=true, это дубль для ясности.)
        run: ./gradlew build --parallel --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: jars-${{ github.sha }}
          path: |
            paper/build/libs/*.jar
            velocity/build/libs/*.jar
          if-no-files-found: error
